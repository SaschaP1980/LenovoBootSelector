name: Import canonical v0.5.4 source

on:
  push:
    paths:
      - '.import-v0.5.4/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import-v0.5.4/chunks/part-*.b64part > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/Lenovo-Boot-Selector-Source-v0.5.4.zip
          echo "0d7d55186589c7c372d3d0e3866b2e19ca26db7e6db1928596e7768d175cd212  /tmp/Lenovo-Boot-Selector-Source-v0.5.4.zip" | sha256sum -c -
          test "$(unzip -Z1 /tmp/Lenovo-Boot-Selector-Source-v0.5.4.zip | wc -l)" -eq 117

      - name: Replace bootstrap repository with canonical source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          unzip -q /tmp/Lenovo-Boot-Selector-Source-v0.5.4.zip -d .
          test -f README.md
          test -f src/Core/BootTargetModel.ps1
          test -f LenovoBootMenuTray.ps1

      - name: Commit canonical v0.5.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import canonical Lenovo Boot Selector v0.5.4 source"
          git push origin HEAD:main
