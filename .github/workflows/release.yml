name: Release Orchestrator

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build, verify, publish and merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('bin/version.json',encoding='utf-8'))['version'])")
          CANDIDATE_SHA="$GITHUB_SHA"
          EXPECTED_BRANCH="release/v$VERSION"
          test "${GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags --force

          if git cat-file -e origin/main:bin/version.json 2>/dev/null; then
            PREVIOUS_VERSION=$(git show origin/main:bin/version.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          elif git cat-file -e origin/main:version.json 2>/dev/null; then
            PREVIOUS_VERSION=$(git show origin/main:version.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          else
            PREVIOUS_VERSION=$(git show origin/main:downloads/latest.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          fi
          RELEASE_LEVEL=$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release_common import classify_release_level; print(classify_release_level(sys.argv[1],sys.argv[2]))' "$PREVIOUS_VERSION" "$VERSION")

          WORK_BRANCH_VALUES=$(git log --format='%B' origin/main..HEAD | sed -n 's/^Work-Branch:[[:space:]]*//p' | sed '/^[[:space:]]*$/d' | sort -u)
          WORK_BRANCH_COUNT=$(printf '%s\n' "$WORK_BRANCH_VALUES" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          test "$WORK_BRANCH_COUNT" = "1" || {
            echo "Release candidate must contain exactly one unique Work-Branch trailer; found $WORK_BRANCH_COUNT." >&2
            exit 1
          }
          WORK_BRANCH=$(printf '%s\n' "$WORK_BRANCH_VALUES" | head -n 1)
          WORK_BRANCH_REASON_VALUES=$(git log --format='%B' origin/main..HEAD | sed -n 's/^Work-Branch-Reason:[[:space:]]*//p' | sed '/^[[:space:]]*$/d' | sort -u)
          WORK_BRANCH_REASON_COUNT=$(printf '%s\n' "$WORK_BRANCH_REASON_VALUES" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')

          case "$RELEASE_LEVEL" in
            major|minor)
              test "$WORK_BRANCH" != "none" || {
                echo "$RELEASE_LEVEL releases require a durable work/LBS-* branch." >&2
                exit 1
              }
              test "$WORK_BRANCH_REASON_COUNT" = "0" || {
                echo "Work-Branch-Reason is reserved for Patch/Hotfix exceptions." >&2
                exit 1
              }
              ;;
            patch|hotfix)
              if [ "$WORK_BRANCH" = "none" ]; then
                test "$WORK_BRANCH_REASON_COUNT" = "0" || {
                  echo "Work-Branch-Reason is invalid when Work-Branch is none." >&2
                  exit 1
                }
              else
                test "$WORK_BRANCH_REASON_COUNT" = "1" || {
                  echo "$RELEASE_LEVEL work-branch exception requires exactly one Work-Branch-Reason trailer." >&2
                  exit 1
                }
              fi
              ;;
          esac

          CANDIDATE_TREE=$(git rev-parse "$CANDIDATE_SHA^{tree}")
          if [ "$WORK_BRANCH" != "none" ]; then
            [[ "$WORK_BRANCH" =~ ^work/LBS-[0-9]+$ ]] || {
              echo "Invalid Work-Branch trailer: $WORK_BRANCH" >&2
              exit 1
            }
            REMOTE_WORK_SHA=$(git ls-remote --heads origin "refs/heads/$WORK_BRANCH" | awk '{print $1}')
            if [ -n "$REMOTE_WORK_SHA" ]; then
              git fetch origin "refs/heads/$WORK_BRANCH:refs/remotes/origin/$WORK_BRANCH" --force
              WORK_TREE=$(git rev-parse "refs/remotes/origin/$WORK_BRANCH^{tree}")
              test "$WORK_TREE" = "$CANDIDATE_TREE" || {
                echo "Work branch advanced or diverged after candidate creation; refusing release cleanup: $WORK_BRANCH" >&2
                exit 1
              }
            fi
          fi

          PREFLIGHT_STATUS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status")
          PREFLIGHT_STATE=$(printf '%s' "$PREFLIGHT_STATUS_JSON" | jq -r '[.statuses[] | select(.context=="preflight/candidate")][0].state // ""')
          LINUX_PREFLIGHT_STATE=$(printf '%s' "$PREFLIGHT_STATUS_JSON" | jq -r '[.statuses[] | select(.context=="preflight/linux")][0].state // ""')
          WINDOWS_PREFLIGHT_STATE=$(printf '%s' "$PREFLIGHT_STATUS_JSON" | jq -r '[.statuses[] | select(.context=="preflight/windows-powershell51")][0].state // ""')
          test "$PREFLIGHT_STATE" = "success" || {
            echo "Release SHA lacks successful preflight/candidate status." >&2
            exit 1
          }
          test "$LINUX_PREFLIGHT_STATE" = "success" || {
            echo "Release SHA lacks successful preflight/linux status." >&2
            exit 1
          }
          test "$WINDOWS_PREFLIGHT_STATE" = "success" || {
            echo "Release SHA lacks successful preflight/windows-powershell51 status." >&2
            exit 1
          }
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Release candidate is stale: current main is not an ancestor." >&2
            exit 1
          }

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists; refusing to overwrite." >&2
            exit 1
          fi

          # GitHub owns publication time. Capture it only after the hosted runner is actually executing
          # the release job, never during local preparation. Reuse the exact same value for both
          # deterministic rebuilds.
          PUBLISHED_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "GitHub publication timestamp: $PUBLISHED_UTC"

          rm -rf /tmp/lbs-release /tmp/lbs-release-check /tmp/lbs-basis
          mkdir -p /tmp/lbs-release /tmp/lbs-release-check
          git worktree add --detach /tmp/lbs-basis "v$PREVIOUS_VERSION^{commit}"

          # GitHub independently recreates all generated source and both packages.
          python3 -B tools/prepare_release.py --root . --output-dir /tmp/lbs-release --published-utc "$PUBLISHED_UTC"
          python3 -B tools/prepare_release.py --root . --output-dir /tmp/lbs-release-check --published-utc "$PUBLISHED_UTC" --check
          cmp "/tmp/lbs-release/LenovoBootMenuTray-v$VERSION.zip" "/tmp/lbs-release-check/LenovoBootMenuTray-v$VERSION.zip"
          cmp "/tmp/lbs-release/Lenovo-Boot-Selector-Source-v$VERSION.zip" "/tmp/lbs-release-check/Lenovo-Boot-Selector-Source-v$VERSION.zip"
          printf 'verified\n' > /tmp/lbs-release/reproducible.ok

          # Run the permanent gates before any PR or tag exists.
          python3 -B tests/validate_release.py --root .
          python3 -B tests/validate_core.py --root . --basis-root /tmp/lbs-basis
          python3 -B tests/validate_boundary.py --root .
          python3 -B tests/validate_regression.py --root . --basis-root /tmp/lbs-basis --release-zip "/tmp/lbs-release/LenovoBootMenuTray-v$VERSION.zip"

          # Remove interpreter caches before deriving any Git source state.
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          # Derive the exact ZIP-free source commit without a helper branch.
          git add -A
          SOURCE_INDEX=/tmp/lbs-source.index
          cp "$(git rev-parse --git-path index)" "$SOURCE_INDEX"
          GIT_INDEX_FILE="$SOURCE_INDEX" git rm -q --cached --ignore-unmatch downloads/*.zip
          SOURCE_TREE=$(GIT_INDEX_FILE="$SOURCE_INDEX" git write-tree)
          PREVIOUS_SOURCE=$(git rev-parse "v$PREVIOUS_VERSION^{commit}")
          SOURCE_COMMIT=$(printf '%s\n' "Lenovo Boot Selector v$VERSION exact source" | git commit-tree "$SOURCE_TREE" -p "$PREVIOUS_SOURCE")
          if git ls-tree -r --name-only "$SOURCE_COMMIT" | grep -E '\.zip$'; then
            echo "Exact source commit contains ZIP files." >&2
            exit 1
          fi
          if git ls-tree -r --name-only "$SOURCE_COMMIT" | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "Exact source commit contains Python cache artifacts." >&2
            exit 1
          fi

          # Add exactly one new historical release ZIP to the same release branch.
          RELEASE="/tmp/lbs-release/LenovoBootMenuTray-v$VERSION.zip"
          cp "$RELEASE" "downloads/LenovoBootMenuTray-v$VERSION.zip"
          git add -A
          ZIP_DIFF=$(git diff --cached --name-status origin/main -- 'downloads/*.zip')
          EXPECTED_ZIP_DIFF=$(printf 'A\tdownloads/LenovoBootMenuTray-v%s.zip' "$VERSION")
          test "$ZIP_DIFF" = "$EXPECTED_ZIP_DIFF"
          DELETED_PATHS=$(git diff --cached --name-only --diff-filter=D --no-renames origin/main || true)
          if [ -n "$DELETED_PATHS" ]; then
            if git cat-file -e origin/main:version.json 2>/dev/null && \
               ! git cat-file -e origin/main:bin/version.json 2>/dev/null && \
               test -f bin/version.json; then
              EXPECTED_LBS2_DELETIONS=$(printf '%s\n' \
                BUILD_INTEGRITY.txt \
                icon-preview.png \
                Install-LenovoBootMenuTasks.ps1 \
                LenovoBootMenuTray.ico \
                LenovoBootMenuTray.ps1 \
                Start-LenovoBootMenuTray.cmd \
                Start-LenovoBootMenuTray.vbs \
                Uninstall-LenovoBootMenuTasks.cmd \
                Uninstall-LenovoBootMenuTasks.ps1 \
                version.json | sort)
              ACTUAL_DELETIONS=$(printf '%s\n' "$DELETED_PATHS" | sort)
              test "$ACTUAL_DELETIONS" = "$EXPECTED_LBS2_DELETIONS" || {
                echo "LBS-2 migration delete set is not exact." >&2
                printf '%s\n' "$DELETED_PATHS" >&2
                exit 1
              }
              for path in BUILD_INTEGRITY.txt icon-preview.png Install-LenovoBootMenuTasks.ps1 LenovoBootMenuTray.ico LenovoBootMenuTray.ps1 Start-LenovoBootMenuTray.cmd Start-LenovoBootMenuTray.vbs Uninstall-LenovoBootMenuTasks.cmd Uninstall-LenovoBootMenuTasks.ps1 version.json; do
                test -f "bin/$path" || { echo "LBS-2 migration target missing: bin/$path" >&2; exit 1; }
              done
            elif git cat-file -e origin/main:ARCHITECTURE_BASELINE.json 2>/dev/null && \
                 git cat-file -e origin/main:CATCH_AUDIT.json 2>/dev/null && \
                 test -f docs/architecture/ARCHITECTURE_BASELINE.json && \
                 test -f audits/CATCH_AUDIT.json; then
              EXPECTED_LBS1_DELETIONS=$(git ls-tree -r --name-only origin/main | \
                grep -E '^(ARCHITECTURE_BASELINE(_v[^/]+)?|CATCH_AUDIT(_v[^/]+)?)\.json$' | sort)
              ACTUAL_DELETIONS=$(printf '%s\n' "$DELETED_PATHS" | sort)
              test "$ACTUAL_DELETIONS" = "$EXPECTED_LBS1_DELETIONS" || {
                echo "LBS-1 migration delete set is not exact." >&2
                printf '%s\n' "$DELETED_PATHS" >&2
                exit 1
              }
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  ARCHITECTURE_BASELINE*.json) target="docs/architecture/$path" ;;
                  CATCH_AUDIT*.json) target="audits/$path" ;;
                  *) echo "Unexpected LBS-1 migration source: $path" >&2; exit 1 ;;
                esac
                test -f "$target" || { echo "LBS-1 migration target missing: $target" >&2; exit 1; }
              done <<< "$DELETED_PATHS"
              if find . -maxdepth 1 -type f \( -name 'ARCHITECTURE_BASELINE*.json' -o -name 'CATCH_AUDIT*.json' \) | grep -q .; then
                echo "LBS-1 migration left architecture/audit JSONs in repository root." >&2
                exit 1
              fi
            elif git cat-file -e origin/main:tests/validate_v040.py 2>/dev/null && \
                 test -f tests-history/release-v0.4.0.py; then
              EXPECTED_LBS13_DELETIONS=$(git ls-tree -r --name-only origin/main | \
                grep -E '^tests/validate_v[0-9]+(_(core|boundary|regression))?\.py$' | sort)
              ACTUAL_DELETIONS=$(printf '%s\n' "$DELETED_PATHS" | sort)
              test "$ACTUAL_DELETIONS" = "$EXPECTED_LBS13_DELETIONS" || {
                echo "LBS-13 migration delete set is not exact." >&2
                printf '%s\n' "$DELETED_PATHS" >&2
                exit 1
              }
              EXPECTED_LBS13_COUNT=$(printf '%s\n' "$EXPECTED_LBS13_DELETIONS" | grep -c .)
              ACTUAL_LBS13_COUNT=$(find tests-history -maxdepth 1 -type f -name '*.py' | wc -l | tr -d ' ')
              test "$ACTUAL_LBS13_COUNT" = "$EXPECTED_LBS13_COUNT" || {
                echo "LBS-13 historical validator count differs from migrated source count." >&2
                exit 1
              }
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                source_blob=$(git rev-parse "origin/main:$path")
                if ! git ls-tree -r HEAD tests-history | awk -v sha="$source_blob" '$3 == sha { found=1 } END { exit(found ? 0 : 1) }'; then
                  echo "LBS-13 historical validator blob missing for $path" >&2
                  exit 1
                fi
              done <<< "$DELETED_PATHS"
              if find tests -maxdepth 1 -type f -name 'validate_v*.py' | grep -q .; then
                echo "LBS-13 migration left versioned validators in active tests/." >&2
                exit 1
              fi
            elif git cat-file -e origin/main:src/App/LenovoBootMenuTray.template.ps1 2>/dev/null && \
                 test -f src/App/LenovoBootSelector.template.ps1; then
              EXPECTED_LBS19_DELETIONS='src/App/LenovoBootMenuTray.template.ps1'
              ACTUAL_DELETIONS=$(printf '%s\n' "$DELETED_PATHS" | sort)
              test "$ACTUAL_DELETIONS" = "$EXPECTED_LBS19_DELETIONS" || {
                echo "LBS-19 template rename delete set is not exact." >&2
                printf '%s\n' "$DELETED_PATHS" >&2
                exit 1
              }
              test -f src/App/LenovoBootSelector.template.ps1 || {
                echo "LBS-19 canonical template target missing." >&2
                exit 1
              }
            else
              echo "Release unexpectedly deletes repository files." >&2
              printf '%s\n' "$DELETED_PATHS" >&2
              exit 1
            fi
          fi

          git commit -m "Publish Lenovo Boot Selector v$VERSION"
          FINAL_SHA=$(git rev-parse HEAD)
          git push origin HEAD:"refs/heads/$EXPECTED_BRANCH"

          # Attach permanent gate results directly to the final PR head.
          status_ok() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
              -f state=success -f context="$1" -f description="$2" >/dev/null
          }
          status_ok 'release/source-integrity' 'ZIP-free exact source commit verified'
          status_ok 'release/core' 'Permanent core suite passed'
          status_ok 'release/boundary' 'Privilege and architecture boundaries passed'
          status_ok 'release/regression' 'Release-profile regression suite passed'
          status_ok 'release/package' 'Release package integrity passed'
          status_ok 'release/reproducibility' 'Independent GitHub rebuild is byte-identical'
          status_ok 'release/history' 'Historical release ZIPs are unchanged'

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$EXPECTED_BRANCH" \
            --title "Publish Lenovo Boot Selector v$VERSION" \
            --body "One release branch, one PR and one merge. GitHub independently rebuilt and verified the release before this PR. Historical ZIPs are unchanged and exactly one new release ZIP is added.")

          # Tag only after all gates and successful PR creation, but before merge.
          git tag -a "v$VERSION" "$SOURCE_COMMIT" -m "Lenovo Boot Selector v$VERSION"
          git push origin "refs/tags/v$VERSION"
          test "$(git rev-parse "v$VERSION^{commit}")" = "$SOURCE_COMMIT"
          status_ok 'release/tag' 'Annotated ZIP-free source tag verified'

          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

          # Work branches are durable recovery state during development, but they are
          # disposable only after successful publication. Re-check the exact tree at
          # deletion time so an active/advanced branch can never be removed by accident.
          if [ "$WORK_BRANCH" != "none" ]; then
            REMOTE_WORK_SHA=$(git ls-remote --heads origin "refs/heads/$WORK_BRANCH" | awk '{print $1}')
            if [ -n "$REMOTE_WORK_SHA" ]; then
              git fetch origin "refs/heads/$WORK_BRANCH:refs/remotes/origin/$WORK_BRANCH" --force
              WORK_TREE=$(git rev-parse "refs/remotes/origin/$WORK_BRANCH^{tree}")
              test "$WORK_TREE" = "$CANDIDATE_TREE" || {
                echo "Work branch changed during release; refusing to delete $WORK_BRANCH." >&2
                exit 1
              }
              git push origin --delete "$WORK_BRANCH"
            fi
          fi

          # LBS-16: aggregate the complete post-release checklist server-side so interactive
          # supervision needs one terminal workflow/log read instead of many GitHub roundtrips.
          python3 -B tools/release_verification.py \
            --root . \
            --version "$VERSION" \
            --candidate-sha "$CANDIDATE_SHA" \
            --work-branch "$WORK_BRANCH" \
            --final-sha "$FINAL_SHA" \
            --source-commit "$SOURCE_COMMIT" \
            --pr-url "$PR_URL" \
            --published-utc "$PUBLISHED_UTC" \
            --release-build-json /tmp/lbs-release/release-build.json \
            --reproducibility-marker /tmp/lbs-release/reproducible.ok \
            --output /tmp/lbs-release/release-verification.json
