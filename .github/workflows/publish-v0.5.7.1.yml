name: Publish Lenovo Boot Selector v0.5.7.1

on:
  push:
    paths:
      - '.publish-v0.5.7.1/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat .publish-v0.5.7.1/chunks/part-*.b64part > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/Lenovo-Boot-Selector-Source-v0.5.7.1.zip
          echo "c9b84c29c973e7692569febcca52f9ef3c9e5d7c29768631387fe6f1c0ff0ba1  /tmp/Lenovo-Boot-Selector-Source-v0.5.7.1.zip" | sha256sum -c -
          test "$(unzip -Z1 /tmp/Lenovo-Boot-Selector-Source-v0.5.7.1.zip | wc -l)" -eq 144
          rm -rf /tmp/v0571-source /tmp/v0571-history
          mkdir -p /tmp/v0571-source /tmp/v0571-history
          unzip -q /tmp/Lenovo-Boot-Selector-Source-v0.5.7.1.zip -d /tmp/v0571-source

      - name: Rebuild release package without tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          root=Path('/tmp/v0571-source')
          out=Path('/tmp/LenovoBootMenuTray-v0.5.7.1.zip')
          names=[
            'BUILD_INTEGRITY.txt','icon-preview.png','Install-LenovoBootMenuTasks.ps1','LenovoBootMenuTray.ico',
            'LenovoBootMenuTray.ps1','README.md','Start-LenovoBootMenuTray.cmd','Start-LenovoBootMenuTray.vbs',
            'Uninstall-LenovoBootMenuTasks.cmd','Uninstall-LenovoBootMenuTasks.ps1'
          ]
          stamp=(2026,10,5,0,0,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in names:
                  zi=zipfile.ZipInfo(name,stamp)
                  zi.create_system=3
                  zi.external_attr=(0o100644<<16)
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(zi,(root/name).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          assert out.stat().st_size == 84906
          assert hashlib.sha256(out.read_bytes()).hexdigest() == '275aa4177188253fadc983f80dde87c9d950d56f229fb0be12f5aca37d414a90'
          PY

      - name: Preserve historical release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "downloads/*.zip" > /dev/null; then cp downloads/*.zip /tmp/v0571-history/; fi

      - name: Create exact v0.5.7.1 source commit and tag
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          unzip -q /tmp/Lenovo-Boot-Selector-Source-v0.5.7.1.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Lenovo Boot Selector v0.5.7.1 source"
          source_commit="$(git rev-parse HEAD)"
          git tag -a v0.5.7.1 "$source_commit" -m "Lenovo Boot Selector v0.5.7.1 | Release SHA256 275aa4177188253fadc983f80dde87c9d950d56f229fb0be12f5aca37d414a90 | Source SHA256 c9b84c29c973e7692569febcca52f9ef3c9e5d7c29768631387fe6f1c0ff0ba1"

      - name: Restore history and publish v0.5.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          if compgen -G "/tmp/v0571-history/*.zip" > /dev/null; then cp /tmp/v0571-history/*.zip downloads/; fi
          cp /tmp/LenovoBootMenuTray-v0.5.7.1.zip downloads/
          python3 - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('downloads/latest.json').read_text())
          assert latest['version']=='0.5.7.1'
          assert latest['sha256']=='275aa4177188253fadc983f80dde87c9d950d56f229fb0be12f5aca37d414a90'
          assert latest['size']==84906
          hist=json.loads(Path('downloads/releases.json').read_text())['releases']
          assert [x['version'] for x in hist[:5]] == ['0.5.7.1','0.5.7','0.5.6','0.5.5','0.5.4']
          PY
          git add downloads
          git commit -m "Publish Lenovo Boot Selector v0.5.7.1 release"
          git push --atomic origin HEAD:main refs/tags/v0.5.7.1
