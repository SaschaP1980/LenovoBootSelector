name: Deploy diagnostics Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm explicit manual production deployment'
        required: true
        type: choice
        options:
          - deploy-diagnostics-worker

permissions:
  contents: read

concurrency:
  group: diagnostics-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'SaschaP1980/LenovoBootSelector' && github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-diagnostics-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Worker source
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fail-closed Worker tests
        run: node --test cloudflare/diagnostics-worker/tests/*.test.mjs

      - name: Check deployment credentials
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_API_TOKEN" = "true"
          test "$HAS_ACCOUNT_ID" = "true"

      - name: Deploy manually to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diagnostics-worker
          wranglerVersion: '4'
          command: deploy
