name: Deploy diagnostics Worker
run-name: Deploy diagnostics Worker (${{ inputs.expected_version || 'manual recovery' }})

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm Worker deployment (automatic on successful release; manual recovery fallback)'
        required: true
        type: choice
        options:
          - deploy-diagnostics-worker
      expected_main_sha:
        description: 'Exact main SHA supplied by the Release Orchestrator (empty only for manual recovery)'
        required: false
        type: string
        default: ''
      expected_version:
        description: 'Exact released version supplied by Release Orchestrator (empty only for manual recovery)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: diagnostics-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'SaschaP1980/LenovoBootSelector' && github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-diagnostics-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only canonical released main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate released main and immutable package before using secrets
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          actual_version=$(python3 -c 'import json; print(json.load(open("bin/version.json",encoding="utf-8"))["version"])')
          latest_version=$(jq -r '.version' downloads/latest.json)
          latest_tag=$(jq -r '.tag' downloads/latest.json)
          latest_file=$(jq -r '.file' downloads/latest.json)
          latest_sha=$(jq -r '.sha256' downloads/latest.json)
          latest_size=$(jq -r '.size' downloads/latest.json)
          [[ "$actual_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$actual_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$actual_version" = "$latest_version"
          test "$latest_tag" = "v$actual_version"
          test "$latest_file" = "LenovoBootMenuTray-v$actual_version.zip"
          [[ "$latest_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$latest_size" =~ ^[0-9]+$ ]]
          test -f "downloads/$latest_file"
          test "$(stat -c%s "downloads/$latest_file")" = "$latest_size"
          printf '%s  %s\n' "$latest_sha" "downloads/$latest_file" | sha256sum --check --status
          test "$(git show "refs/tags/v$actual_version:bin/version.json" | jq -r '.version')" = "$actual_version"
          # Both fields must be populated together by the verified release flow.
          if [[ -n "$EXPECTED_MAIN_SHA" || -n "$EXPECTED_VERSION" ]]; then
            [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$actual_sha" = "$EXPECTED_MAIN_SHA"
            test "$actual_version" = "$EXPECTED_VERSION"
            echo "AUTO_DEPLOY_PRECHECK=PASS version=$actual_version main_sha=$actual_sha"
          else
            echo "MANUAL_RECOVERY_PRECHECK=PASS version=$actual_version main_sha=$actual_sha"
          fi

      - name: Validate Worker source
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture baseline live Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            'https://lenovo-boot-selector-diagnostics.sascha-petrovitsch.workers.dev/health' \
            > "$RUNNER_TEMP/diagnostics-health-before.json"
          jq -e '(.service=="lenovo-boot-selector-diagnostics") and ((.ingestionEnabled|type)=="boolean")' \
            "$RUNNER_TEMP/diagnostics-health-before.json" >/dev/null

      # Read-only resolution uses GitHub's durable successful production receipt,
      # plus the live Worker fingerprint. No Cloudflare deployment secrets here.
      - name: Select verified health-only or full deploy path
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          TARGET=$(node cloudflare/diagnostics-worker/scripts/deployment-plan.mjs fingerprint)
          [[ "$TARGET" =~ ^[0-9a-f]{64}$ ]]
          gh api --method GET "repos/$GITHUB_REPOSITORY/deployments?environment=diagnostics-worker-production&per_page=1" \
            > "$RUNNER_TEMP/lbs-deployments.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/lbs-deployments.json")" -eq 0 ]; then
            printf 'null\n' > "$RUNNER_TEMP/lbs-deployment-receipt.json"
          else
            ID=$(jq -r '.[0].id' "$RUNNER_TEMP/lbs-deployments.json")
            [[ "$ID" =~ ^[0-9]+$ ]]
            gh api --method GET "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses?per_page=1" \
              > "$RUNNER_TEMP/lbs-deployment-statuses.json"
            STATUS=$(jq -r 'if length == 0 then "pending" else .[0].state end' "$RUNNER_TEMP/lbs-deployment-statuses.json")
            jq --arg status "$STATUS" '.[0] | {
              status:$status, fingerprint:.payload.fingerprint,
              ingestionEnabled:.payload.ingestionEnabled,
              verified:.payload.verified
            }' "$RUNNER_TEMP/lbs-deployments.json" > "$RUNNER_TEMP/lbs-deployment-receipt.json"
          fi
          MODE=auto
          if [ -z "$EXPECTED_MAIN_SHA" ]; then MODE=manual; fi
          PLAN=$(node cloudflare/diagnostics-worker/scripts/deployment-plan.mjs plan \
            "$TARGET" "$RUNNER_TEMP/lbs-deployment-receipt.json" \
            "$RUNNER_TEMP/diagnostics-health-before.json" "$MODE")
          test "$PLAN" = "health-only" -o "$PLAN" = "deploy"
          echo "fingerprint=$TARGET" >> "$GITHUB_OUTPUT"
          echo "mode=$PLAN" >> "$GITHUB_OUTPUT"
          echo "WORKER_DEPLOY_DECISION=$PLAN fingerprint=$TARGET"

      - name: Revalidate published main before any production outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_MAIN_SHA" ]; then
            NOW=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
            test "$NOW" = "$EXPECTED_MAIN_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          fi

      - name: Verify unchanged Worker without redeployment
        if: steps.plan.outputs.mode == 'health-only'
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKER_DEPLOY_RESULT=HEALTH_ONLY_PASS fingerprint=${{ steps.plan.outputs.fingerprint }}"
          echo "WORKER_DEPLOY_HEALTH=PASS"
          # No Wrangler deploy, Cloudflare credentials, KV mutation or secret access.

      - name: Run fail-closed Worker tests
        if: steps.plan.outputs.mode == 'deploy'
        run: node --test cloudflare/diagnostics-worker/tests/*.test.mjs

      - name: Stamp the verified fingerprint in this deployment checkout only
        if: steps.plan.outputs.mode == 'deploy'
        shell: bash
        run: node cloudflare/diagnostics-worker/scripts/deployment-plan.mjs stamp "${{ steps.plan.outputs.fingerprint }}"

      - name: Check Wrangler bundle without deployment
        if: steps.plan.outputs.mode == 'deploy'
        working-directory: cloudflare/diagnostics-worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/lbs-diagnostics-worker-bundle

      - name: Check deployment credentials
        if: steps.plan.outputs.mode == 'deploy'
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_API_TOKEN" = "true"
          test "$HAS_ACCOUNT_ID" = "true"

      # Create a durable GitHub receipt BEFORE deployment. An interrupted/failed
      # run leaves a non-success latest receipt, so a subsequent run cannot
      # incorrectly claim the older successful deployment as current.
      - name: Register pending trusted production deployment
        id: receipt
        if: steps.plan.outputs.mode == 'deploy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.plan.outputs.fingerprint }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          INGESTION=$(jq -r '.ingestionEnabled' "$RUNNER_TEMP/diagnostics-health-before.json")
          jq -n --arg ref "$MAIN_SHA" --arg digest "$TARGET" --argjson enabled "$INGESTION" '{
            ref:$ref,environment:"diagnostics-worker-production",
            auto_merge:false,required_contexts:[],production_environment:true,
            description:"Verified Lenovo diagnostics Worker rollout",
            payload:{fingerprint:$digest,ingestionEnabled:$enabled,verified:true}
          }' > "$RUNNER_TEMP/lbs-create-deployment.json"
          ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input "$RUNNER_TEMP/lbs-create-deployment.json" --jq '.id')
          [[ "$ID" =~ ^[0-9]+$ ]]
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=in_progress -f description="Deployment started after verified source and tests" >/dev/null

      - name: Deploy verified main to Cloudflare
        if: steps.plan.outputs.mode == 'deploy'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diagnostics-worker
          wranglerVersion: '4'
          command: deploy

      - name: Verify health and preserved upload configuration
        if: steps.plan.outputs.mode == 'deploy'
        shell: bash
        env:
          TARGET: ${{ steps.plan.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # LBS-125: retry only read-only complete health checks, including old
          # HTTP 200 fingerprints, with finite attempt/request/total budgets.
          # Existing deployment and receipt writes occur exactly once outside retries.
          node cloudflare/diagnostics-worker/scripts/verify-post-deploy-health.mjs \
            "$TARGET" "$RUNNER_TEMP/diagnostics-health-before.json" \
            "$RUNNER_TEMP/diagnostics-health-after.json"
          echo "WORKER_DEPLOY_HEALTH=PASS"

      - name: Commit successful production deployment receipt
        if: steps.plan.outputs.mode == 'deploy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.receipt.outputs.id }}
          TARGET: ${{ steps.plan.outputs.fingerprint }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=success -f description="Worker fingerprint and upload state verified" \
            -f environment_url='https://lenovo-boot-selector-diagnostics.sascha-petrovitsch.workers.dev/health' >/dev/null
          echo "WORKER_DEPLOY_RESULT=DEPLOYED_AND_HEALTHY fingerprint=$TARGET receipt=$ID"

      - name: Preserve failed production receipt on deployment error
        if: failure() && steps.receipt.outputs.id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.receipt.outputs.id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=failure -f description="Worker deployment or verification failed" >/dev/null
          echo "WORKER_DEPLOY_RESULT=BLOCKED"
