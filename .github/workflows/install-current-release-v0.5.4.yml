name: Install current release ZIP

on:
  push:
    paths:
      - '.release-upload-v0.5.4/READY'

permissions:
  contents: write

jobs:
  install-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload-v0.5.4/chunks/part-*.b64part > /tmp/release.zip.b64
          base64 --decode /tmp/release.zip.b64 > /tmp/LenovoBootMenuTray-v0.5.4.zip
          echo "d31be8d7768e436aebfb4d4b620770b7e71ab3a86159014142eaf7f71e1f0e7d  /tmp/LenovoBootMenuTray-v0.5.4.zip" | sha256sum -c -
          test "$(stat -c '%s' /tmp/LenovoBootMenuTray-v0.5.4.zip)" -eq 108509

      - name: Install downloads folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          rm -f downloads/*.zip
          cp /tmp/LenovoBootMenuTray-v0.5.4.zip downloads/LenovoBootMenuTray-v0.5.4.zip
          cat > downloads/README.md <<'EOF'
          # Downloads

          Hier liegt immer das **aktuelle gebaute Release** des Lenovo Boot Selector.

          ## Aktuelles Build

          [LenovoBootMenuTray-v0.5.4.zip](LenovoBootMenuTray-v0.5.4.zip?raw=1)

          - Version: **v0.5.4**
          - Größe: **108.509 Bytes**
          - SHA-256: `d31be8d7768e436aebfb4d4b620770b7e71ab3a86159014142eaf7f71e1f0e7d`

          Bei einer neuen gebauten Version wird dieses Verzeichnis auf das neue aktuelle Release aktualisiert. Es ist kein Archiv historischer Builds.
          EOF

      - name: Remove one-shot upload staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-upload-v0.5.4
          rm -f .github/workflows/install-current-release-v0.5.4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit release ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add current v0.5.4 release download"
          git push origin HEAD:main
