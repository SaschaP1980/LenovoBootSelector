name: Create v0.5.4 release tag

on:
  push:
    paths:
      - '.github/workflows/create-v0.5.4-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          target="7e40d2c68183a44c4adbff38dbfd41f1c118a7e9"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v0.5.4" >/dev/null; then
            actual="$(git rev-list -n 1 v0.5.4)"
            test "$actual" = "$target"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.5.4 "$target" -m "Lenovo Boot Selector v0.5.4

Release ZIP SHA-256: d31be8d7768e436aebfb4d4b620770b7e71ab3a86159014142eaf7f71e1f0e7d
Source ZIP SHA-256: 0d7d55186589c7c372d3d0e3866b2e19ca26db7e6db1928596e7768d175cd212"
            git push origin refs/tags/v0.5.4
          fi

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f .github/workflows/create-v0.5.4-tag.yml; then
            git rm .github/workflows/create-v0.5.4-tag.yml
            git commit -m "Remove one-shot v0.5.4 tag workflow"
            git push origin HEAD:main
          fi
