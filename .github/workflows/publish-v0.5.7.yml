name: Publish Lenovo Boot Selector v0.5.7

on:
  push:
    paths:
      - '.publish-v0.5.7/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat .publish-v0.5.7/chunks/part-*.b64part > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/Lenovo-Boot-Selector-Source-v0.5.7.zip
          echo "8e024600fdea5b26e7b95017797e7cb544e84cd27757676962a65bfc3d7f3634  /tmp/Lenovo-Boot-Selector-Source-v0.5.7.zip" | sha256sum -c -
          test "$(unzip -Z1 /tmp/Lenovo-Boot-Selector-Source-v0.5.7.zip | wc -l)" -eq 144
          rm -rf /tmp/v057-source /tmp/v057-build /tmp/v057-history
          mkdir -p /tmp/v057-source /tmp/v057-build /tmp/v057-history
          unzip -q /tmp/Lenovo-Boot-Selector-Source-v0.5.7.zip -d /tmp/v057-source

      - name: Validate fresh source and deterministic build
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v057-source/tools/build_runtime.py --root /tmp/v057-source --check
          python3 /tmp/v057-source/tools/build_catch_audit.py --root /tmp/v057-source --check
          python3 /tmp/v057-source/tests/validate_v057.py --root /tmp/v057-source
          python3 /tmp/v057-source/tests/validate_v057_core.py --root /tmp/v057-source
          python3 /tmp/v057-source/tests/validate_v057_boundary.py --root /tmp/v057-source
          python3 /tmp/v057-source/tools/build_packages.py --root /tmp/v057-source --output-dir /tmp/v057-build
          echo "a5eab1a2a902f1572dbecea00093e75e625453b9a6683573215652e05e8d0f8f  /tmp/v057-build/LenovoBootMenuTray-v0.5.7.zip" | sha256sum -c -
          echo "8e024600fdea5b26e7b95017797e7cb544e84cd27757676962a65bfc3d7f3634  /tmp/v057-build/Lenovo-Boot-Selector-Source-v0.5.7.zip" | sha256sum -c -

      - name: Preserve historical release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "downloads/*.zip" > /dev/null; then cp downloads/*.zip /tmp/v057-history/; fi
          echo "d31be8d7768e436aebfb4d4b620770b7e71ab3a86159014142eaf7f71e1f0e7d  /tmp/v057-history/LenovoBootMenuTray-v0.5.4.zip" | sha256sum -c -
          echo "8720b71aa04a0a7f97d034225b137eea7472a13e329767dec1edc1db7910660d  /tmp/v057-history/LenovoBootMenuTray-v0.5.5.zip" | sha256sum -c -
          echo "105f565acab53b1b3f142cdcfcb6bcd6433d330ae117c52b221aab472dab0ffc  /tmp/v057-history/LenovoBootMenuTray-v0.5.6.zip" | sha256sum -c -

      - name: Create exact v0.5.7 source commit and tag
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          unzip -q /tmp/Lenovo-Boot-Selector-Source-v0.5.7.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Lenovo Boot Selector v0.5.7 source"
          source_commit="$(git rev-parse HEAD)"
          git tag -a v0.5.7 "$source_commit" -m "Lenovo Boot Selector v0.5.7 | Release SHA256 a5eab1a2a902f1572dbecea00093e75e625453b9a6683573215652e05e8d0f8f | Source SHA256 8e024600fdea5b26e7b95017797e7cb544e84cd27757676962a65bfc3d7f3634"

      - name: Restore build history and publish v0.5.7 ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          if compgen -G "/tmp/v057-history/*.zip" > /dev/null; then cp /tmp/v057-history/*.zip downloads/; fi
          cp /tmp/v057-build/LenovoBootMenuTray-v0.5.7.zip downloads/
          echo "d31be8d7768e436aebfb4d4b620770b7e71ab3a86159014142eaf7f71e1f0e7d  downloads/LenovoBootMenuTray-v0.5.4.zip" | sha256sum -c -
          echo "8720b71aa04a0a7f97d034225b137eea7472a13e329767dec1edc1db7910660d  downloads/LenovoBootMenuTray-v0.5.5.zip" | sha256sum -c -
          echo "105f565acab53b1b3f142cdcfcb6bcd6433d330ae117c52b221aab472dab0ffc  downloads/LenovoBootMenuTray-v0.5.6.zip" | sha256sum -c -
          echo "a5eab1a2a902f1572dbecea00093e75e625453b9a6683573215652e05e8d0f8f  downloads/LenovoBootMenuTray-v0.5.7.zip" | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('downloads/latest.json').read_text())
          assert data['version']=='0.5.7'
          assert data['sha256']=='a5eab1a2a902f1572dbecea00093e75e625453b9a6683573215652e05e8d0f8f'
          assert data['size']==84801
          hist=json.loads(Path('downloads/releases.json').read_text())['releases']
          assert [x['version'] for x in hist[:4]] == ['0.5.7','0.5.6','0.5.5','0.5.4']
          PY
          git add downloads
          git commit -m "Publish Lenovo Boot Selector v0.5.7 release"
          git push --atomic origin HEAD:main refs/tags/v0.5.7
